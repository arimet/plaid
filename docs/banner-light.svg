<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Plaid: your films and series, at home">
  <!-- Plaid banner (light): the landing page's neumorphic surface, teal accent, tartan mark. -->
  <defs>
    <filter id="raised" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="-10" stdDeviation="11" flood-color="#ffffff" flood-opacity=".85"/>
      <feDropShadow dx="10" dy="10" stdDeviation="11" flood-color="#a3b1c6" flood-opacity=".75"/>
    </filter>
    <linearGradient id="fill" x1="0" x2="1"><stop offset="0" stop-color="#0089a8"/><stop offset="1" stop-color="#00a8c9"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="in1"><rect x="876" y="104" width="312" height="232" rx="20"/></clipPath>
    <clipPath id="in2"><rect x="904" y="238" width="256" height="10" rx="5"/></clipPath>
    <clipPath id="mark"><rect x="88" y="96" width="88" height="88" rx="22"/></clipPath>
  </defs>
  <rect width="1280" height="440" rx="32" fill="#e0e5ec"/>

  <!-- the tartan mark, raised -->
  <rect x="88" y="96" width="88" height="88" rx="22" fill="#e0e5ec" filter="url(#raised)"/>
  <g clip-path="url(#mark)">
    <rect x="88" y="96" width="88" height="88" fill="#1e5b45"/>
    <g opacity=".85"><rect x="102" y="96" width="11" height="88" fill="#b8242f"/><rect x="129" y="96" width="4" height="88" fill="#e8b230"/><rect x="148" y="96" width="16" height="88" fill="#22305e"/></g>
    <g opacity=".6"><rect x="88" y="110" width="88" height="11" fill="#b8242f"/><rect x="88" y="137" width="88" height="4" fill="#e8b230"/><rect x="88" y="156" width="88" height="16" fill="#22305e"/></g>
  </g>
  <text x="204" y="168" font-family="Nunito, 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="84" letter-spacing="-2" fill="#3d4757">Plaid</text>

  <text x="88" y="262" font-family="Nunito, 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" letter-spacing="-.6" fill="#3d4757">Your films and series, <tspan fill="#00748f">at home.</tspan></text>
  <text x="88" y="312" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#56627a">Seven apps, installed and linked in one sitting.</text>
  <text x="88" y="344" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#56627a">One click removes them, without a trace.</text>

  <!-- the "installing" card from the assistant -->
  <rect x="856" y="84" width="352" height="272" rx="28" fill="#e0e5ec" filter="url(#raised)"/>
  <g clip-path="url(#in1)"><rect x="876" y="104" width="312" height="232" rx="20" fill="#e0e5ec"/><rect x="881" y="109" width="312" height="232" rx="20" fill="none" stroke="#a3b1c6" stroke-opacity=".75" stroke-width="10" filter="url(#soft)"/><rect x="871" y="99" width="312" height="232" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="10" filter="url(#soft)"/></g>
  <text x="904" y="146" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#8b97ab">INSTALLING</text>
  <text x="902" y="214" font-family="Nunito, 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" letter-spacing="-2" fill="#00748f">73<tspan font-size="26" fill="#56627a" dx="4">%</tspan></text>
  <g clip-path="url(#in2)"><rect x="904" y="238" width="256" height="10" rx="5" fill="#e0e5ec"/><rect x="906" y="240" width="256" height="10" rx="5" fill="none" stroke="#a3b1c6" stroke-opacity=".75" stroke-width="4" filter="url(#soft)"/><rect x="902" y="236" width="256" height="10" rx="5" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="4" filter="url(#soft)"/></g>
  <rect x="904" y="238" width="187" height="10" rx="5" fill="url(#fill)"/>
  <circle cx="912" cy="282" r="9" fill="url(#fill)"/><path d="M907.5 282.3l3 3 5.5-6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="932" y="288" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#56627a">Downloading the apps</text>
  <circle cx="912" cy="312" r="9" fill="none" stroke="#00a8c9" stroke-width="2.5" stroke-dasharray="40 20"/>
  <text x="932" y="318" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#3d4757">Linking them together</text>
</svg>
