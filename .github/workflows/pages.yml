name: pages

# The landing page, plus the Linux install script at /get so the one-liner stays short.
on:
  push:
    branches: [main]
    paths: ["site/**", "launchers/get.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp -r site _site
          cp launchers/get.sh _site/get
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deploy
        uses: actions/deploy-pages@v4
